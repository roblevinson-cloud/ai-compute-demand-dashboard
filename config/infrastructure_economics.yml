version: "1.0.0"
as_of: "2026-08-04"

scenario_labels:
  bear: Slower demand, lower pricing, higher operating cost
  base: Central adoption, pricing, and cost assumptions
  bull: Faster demand, stronger pricing, better operating leverage

scenario_modifiers:
  bear:
    annual_project_revenue_usd_b: {multiply: 0.80}
    blended_revenue_per_gpu_hour_usd: {multiply: 0.90}
    non_power_opex_pct_revenue: {add: 4.0}
    energy_cost_per_kwh_usd: {multiply: 1.20}
    revenue_growth_pct: {add: -6.0}
    maintenance_capex_pct_revenue: {add: 1.0}
    discount_rate_pct: {add: 2.0}
    residual_value_pct: {add: -3.0}
  base: {}
  bull:
    annual_project_revenue_usd_b: {multiply: 1.20}
    blended_revenue_per_gpu_hour_usd: {multiply: 1.07}
    non_power_opex_pct_revenue: {add: -3.0}
    energy_cost_per_kwh_usd: {multiply: 0.90}
    revenue_growth_pct: {add: 6.0}
    maintenance_capex_pct_revenue: {add: -1.0}
    discount_rate_pct: {add: -1.5}
    residual_value_pct: {add: 3.0}

assumptions:
  total_capex_basis_usd_b:
    label: Capital spend basis
    unit: USD billions
    short_unit: $B
    description: Latest reported annual capital expenditure when available; otherwise the disclosed model fallback.
    min: 1
    max: 160
    step: 0.5
  ai_capex_share_pct:
    label: AI infrastructure share
    unit: percent of capital spend
    short_unit: "%"
    description: Share of total capital expenditure allocated to the modeled AI data-center project.
    min: 10
    max: 100
    step: 1
  gpu_hardware_share_pct:
    label: Accelerated-compute share
    unit: percent of project capex
    short_unit: "%"
    description: Portion of project capital assigned to GPUs, accelerator systems, and supporting compute hardware.
    min: 20
    max: 85
    step: 1
  all_in_gpu_cost_usd:
    label: All-in accelerator cost
    unit: USD per GPU-equivalent
    short_unit: "$"
    description: Accelerator plus allocated server, networking, installation, and commissioning cost.
    min: 20000
    max: 90000
    step: 1000
  annual_project_revenue_usd_b:
    label: Annual project revenue
    unit: USD billions
    short_unit: $B
    description: Annual incremental revenue or internal economic value attributable to the modeled capacity.
    min: 1
    max: 120
    step: 0.5
  blended_revenue_per_gpu_hour_usd:
    label: Revenue per GPU-hour
    unit: USD per GPU-hour
    short_unit: $/GPU-h
    description: Blended external price or internal value realized for an occupied accelerator hour.
    min: 1
    max: 20
    step: 0.1
  non_power_opex_pct_revenue:
    label: Non-power operating cost
    unit: percent of revenue
    short_unit: "%"
    description: Labor, networking, software, facilities, and other cash operating costs excluding electricity.
    min: 5
    max: 65
    step: 1
  energy_cost_per_kwh_usd:
    label: Electricity cost
    unit: USD per kWh
    short_unit: $/kWh
    description: Delivered electricity price before multiplying by power usage effectiveness.
    min: 0.02
    max: 0.20
    step: 0.005
  pue:
    label: Power usage effectiveness
    unit: ratio
    short_unit: x
    description: Total facility power divided by IT equipment power.
    min: 1.05
    max: 1.60
    step: 0.01
  gpu_power_kw:
    label: Accelerator system draw
    unit: kW per GPU-equivalent
    short_unit: kW
    description: Average occupied power draw of an accelerator and its allocated host components.
    min: 0.40
    max: 1.80
    step: 0.05
  depreciation_years:
    label: Depreciable life
    unit: years
    short_unit: yr
    description: Straight-line useful life used for accelerator and project depreciation.
    min: 3
    max: 10
    step: 1
  revenue_growth_pct:
    label: Annual revenue growth
    unit: percent
    short_unit: "%"
    description: Annual growth in project revenue after the first modeled year.
    min: -15
    max: 40
    step: 1
  tax_rate_pct:
    label: Cash tax rate
    unit: percent
    short_unit: "%"
    description: Marginal cash tax rate applied to positive project EBIT.
    min: 0
    max: 35
    step: 1
  maintenance_capex_pct_revenue:
    label: Maintenance capex
    unit: percent of revenue
    short_unit: "%"
    description: Recurring capital expenditure required to sustain the project fleet and facilities.
    min: 0
    max: 20
    step: 0.5
  discount_rate_pct:
    label: Discount rate
    unit: percent
    short_unit: "%"
    description: Unlevered nominal hurdle rate used for project NPV.
    min: 4
    max: 25
    step: 0.5
  project_life_years:
    label: Project life
    unit: years
    short_unit: yr
    description: Explicit cash-flow forecast period.
    min: 4
    max: 15
    step: 1
  residual_value_pct:
    label: Residual value
    unit: percent of initial capex
    short_unit: "%"
    description: End-of-project proceeds from reusable facilities, networking, and hardware.
    min: 0
    max: 30
    step: 1

