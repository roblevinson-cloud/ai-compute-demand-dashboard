services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dcintel}
      POSTGRES_USER: ${POSTGRES_USER:-dcintel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dcintel}
    ports:
      - "5432:5432"
    volumes:
      - dcintel_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dcintel} -d ${POSTGRES_DB:-dcintel}"]
      interval: 5s
      timeout: 5s
      retries: 20

  init:
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dcintel}:${POSTGRES_PASSWORD:-dcintel}@postgres:5432/${POSTGRES_DB:-dcintel}
    command: ["sh", "-c", "dc-intel init-db && dc-intel sync-sources && dc-intel seed-demo-db"]
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dcintel}:${POSTGRES_PASSWORD:-dcintel}@postgres:5432/${POSTGRES_DB:-dcintel}
      MONITOR_CONTACT_EMAIL: ${MONITOR_CONTACT_EMAIL:-monitor@example.com}
      BUILD_LIVE_DASHBOARD: "1"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      - ./docs:/app/docs
    depends_on:
      init:
        condition: service_completed_successfully

  dashboard:
    image: python:3.12-alpine
    working_dir: /site
    command: ["python", "-m", "http.server", "8080"]
    ports:
      - "8080:8080"
    volumes:
      - ./docs:/site:ro

volumes:
  dcintel_postgres:
