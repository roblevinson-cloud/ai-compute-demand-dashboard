name: Refresh China passenger vehicle exports

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/china_vehicle_exports.py'
      - 'docs/china-auto/index.html'
      - '.github/workflows/china_vehicle_exports.yml'
  schedule:
    - cron: '17 12 * * *'

permissions:
  contents: write

concurrency:
  group: china-passenger-vehicle-exports
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check requests country_converter
      - name: Probe China Data Portal current-trade schema
        run: |
          python - <<'PY'
          import json, requests
          u='https://chinadata.live/api/v2/trade/hs/870380?flow=export&period=2026&limit=20'
          r=requests.get(u, timeout=30)
          print('status', r.status_code, 'content-type', r.headers.get('content-type'))
          r.raise_for_status()
          j=r.json()
          print('top keys', list(j) if isinstance(j,dict) else type(j).__name__)
          print(json.dumps(j, ensure_ascii=False)[:12000])
          PY
      - name: Refresh China HS 8703 country-month history
        run: python scripts/china_vehicle_exports.py --output docs/china-auto/data/exports.json
      - name: Commit refreshed snapshot
        run: |
          git config user.name "china-auto-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/china-auto/data/exports.json
          git diff --cached --quiet && exit 0
          git commit -m "data: refresh China passenger vehicle exports [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
