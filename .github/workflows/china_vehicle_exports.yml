name: Refresh China passenger vehicle exports

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/china_vehicle_exports.py'
      - 'docs/china-auto/index.html'
      - '.github/workflows/china_vehicle_exports.yml'
  schedule:
    - cron: '17 12 * * *'

permissions:
  contents: write

concurrency:
  group: china-passenger-vehicle-exports
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check requests country_converter
      - name: Probe current China vehicle feeds
        run: |
          python - <<'PY'
          import json, requests

          # GACC-derived public HS4 value feed.
          for hs in ('8703','870380'):
              u=f'https://chinadata.live/api/v2/trade/hs/{hs}?flow=export&period=2026&limit=20'
              r=requests.get(u, timeout=30)
              print('CHINADATA', hs, r.status_code, r.headers.get('content-type'))
              if r.ok:
                  j=r.json()
                  print('COVERAGE', hs, json.dumps(j.get('coverage',{}), ensure_ascii=False))
                  print('LATEST', hs, json.dumps(j.get('latest',{}), ensure_ascii=False))
                  print('PARTNER_LIMIT', hs, j.get('public_partner_limit'))
                  print('LATEST_PARTNERS_SAMPLE', hs, json.dumps((j.get('latest_partners') or [])[:3], ensure_ascii=False))

          # Official destination-reported mirror imports from China. This tests whether
          # Comtrade's public monthly endpoint can return one HS8703 row per reporting
          # destination in a single request for recent months.
          base='https://comtradeapi.un.org/public/v1/preview/C/M/HS'
          variants=[
              {'reportercode':'all','period':'202607','flowCode':'M','partnerCode':156,'cmdCode':'8703','maxRecords':500,'breakdownMode':'classic','includeDesc':'true'},
              {'reportercode':'all','period':'202507','flowCode':'M','partnerCode':156,'cmdCode':'8703','maxRecords':500,'breakdownMode':'classic','includeDesc':'true'},
          ]
          for p in variants:
              r=requests.get(base, params=p, timeout=60)
              print('MIRROR', p['period'], r.status_code, r.url)
              if r.ok:
                  j=r.json()
                  rows=j.get('data',[]) if isinstance(j,dict) else []
                  print('MIRROR_COUNT', p['period'], j.get('count'), 'rows', len(rows), 'error', j.get('error'))
                  print('MIRROR_SAMPLE', p['period'], json.dumps(rows[:3], ensure_ascii=False)[:5000])
              else:
                  print('MIRROR_BODY', r.text[:1000])
          PY
      - name: Refresh China HS 8703 country-month history
        run: python scripts/china_vehicle_exports.py --output docs/china-auto/data/exports.json
      - name: Commit refreshed snapshot
        run: |
          git config user.name "china-auto-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/china-auto/data/exports.json
          git diff --cached --quiet && exit 0
          git commit -m "data: refresh China passenger vehicle exports [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
