name: Refresh China passenger vehicle exports

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/china_vehicle_exports.py'
      - 'scripts/china_vehicle_current.py'
      - 'docs/china-auto/index.html'
      - '.github/workflows/china_vehicle_exports.yml'
  schedule:
    - cron: '17 12 * * *'

permissions:
  contents: write

concurrency:
  group: china-passenger-vehicle-exports
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check requests country_converter
      - name: Refresh verified China-reported HS 8703 history
        run: python scripts/china_vehicle_exports.py --output docs/china-auto/data/exports.json
      - name: Refresh current GACC value and destination mirror pulse
        run: python scripts/china_vehicle_current.py --output docs/china-auto/data/current.json
      - name: Commit refreshed snapshots
        run: |
          git config user.name "china-auto-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/china-auto/data/exports.json docs/china-auto/data/current.json
          git diff --cached --quiet && exit 0
          git commit -m "data: refresh China passenger vehicle monitor [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
