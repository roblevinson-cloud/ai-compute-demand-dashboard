name: Refresh data-center electrician labor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/dc-labor.yml"
      - "scripts/collect_dc_labor_v2.py"
      - "scripts/collect_dc_labor_v3.py"

permissions:
  contents: write

concurrency:
  group: dc-labor-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install collector dependency
        run: python -m pip install 'requests>=2.32,<3'
      - name: Collect and rebuild labor dashboard
        run: python scripts/collect_dc_labor_v3.py
      - name: Commit source snapshots and observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dc_labor docs/labor/data.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh electrician labor monitor"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
