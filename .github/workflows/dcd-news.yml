name: Monitor DCD project news

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ai-compute-dashboard
  cancel-in-progress: false

jobs:
  update-dcd-news:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install "requests>=2.32,<3"

      - name: Pull DCD RSS and match tracked projects
        run: python scripts/update_dcd_news.py

      - name: Commit new matching stories
        id: news
        run: |
          if git diff --quiet -- docs/data-centers/data/news.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "ai-compute-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data-centers/data/news.json
          git commit -m "news: refresh DCD project feed [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v5
        if: steps.news.outputs.changed == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.news.outputs.changed == 'true'
        with:
          path: docs

      - name: Deploy updated news feed
        id: deployment
        if: steps.news.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
